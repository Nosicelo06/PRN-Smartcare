{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare - Register</title>

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>

<div class="container">

    <div class="form-box">

        <h2>Create Account</h2>
        <p class="subtitle">Register to access SmartCare Clinic System</p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="error-msg">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="register-form">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">First Name</label>
                    <input type="text" id="first_name" name="first_name" placeholder="First name" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" placeholder="Surname" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Email address" required>
            </div>

            <div class="form-group">
                <label for="cell_number">Cell Number</label>
                <input type="text" id="cell_number" name="cell_number" placeholder="Cell number" required>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" required>
                    <option value="">Select Role</option>
                    <option value="admin">Administrator</option>
                    <option value="Receptionist">Receptionist</option>
                    <option value="Doctor">Doctor</option>
                    <option value="Nurse">Nurse</option>
                    <option value="Pharmacist">Pharmacist</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password1" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmpassword" placeholder="Confirm password" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Register</button>

        </form>

        <p class="switch-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

</body>
</html>
